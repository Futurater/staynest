version: '3.8'

services:
  web:
    build: .
    container_name: staynest-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=development
      - ATLASDB_URL=mongodb://mongo:27017/staynest
      - SECRET=staynest_super_secret_session_key
      # Add optional Cloudinary or Gemini API keys here or in a local .env file
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: staynest-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
